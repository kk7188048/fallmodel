# Experiment: smaller window stride than default.yaml (5 instead of 15)
# to generate more overlapping windows around each fall interval, i.e.
# more positive training examples without new data. Separate processed_dir
# / checkpoints_dir / mlflow_uri from default.yaml so this doesn't clobber
# the baseline run recorded in EXPERIMENTS.md.

paths:
  raw_dir: data/raw
  processed_dir: data/processed_stride5
  inventory_file: data/inventory.json
  splits_file: data/splits.json
  checkpoints_dir: checkpoints_stride5
  mlflow_uri: sqlite:///mlruns_stride5.db

pose:
  model_complexity: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

windowing:
  window_size: 30
  stride: 5
  fps: 30

model:
  input_dim: null
  hidden_dim: 128
  num_layers: 2
  bidirectional: true
  attention_dim: 64
  dropout: 0.3
  num_classes: 2

train:
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  max_epochs: 100
  early_stopping_patience: 10
  seed: 42
